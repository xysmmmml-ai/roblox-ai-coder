<script>
  const GROQ_URL = "https://api.groq.com/openai/v1/chat/completions";
  const GROQ_MODEL = "openai/gpt-oss-20b";

  async function generateCode() {
    const apiKey = document.getElementById("apiKey").value.trim();
    const prompt = document.getElementById("prompt").value.trim();
    const engine = document.getElementById("engine").value;

    const button = document.getElementById("generateBtn");
    const container = document.getElementById("outputContainer");
    const output = document.getElementById("outputCode");

    if (!apiKey) {
      alert("Please enter your Groq API key.");
      return;
    }

    if (!prompt) {
      alert("Please enter a description for the script.");
      return;
    }

    button.disabled = true;
    button.innerText = "Generating...";

    container.classList.remove("hidden");
    output.innerText = "Connecting to Groq...";

    try {
      const response = await fetch(GROQ_URL, {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + apiKey
        },

        body: JSON.stringify({
          model: GROQ_MODEL,

          messages: [
            {
              role: "system",
              content:
                "You are an expert Roblox Studio Luau developer. " +
                "Write clean, working, production-quality Roblox Luau code. " +
                "Clearly explain where every script belongs in Roblox Studio. " +
                "Use ModuleScripts for large systems. " +
                "Never use nonexistent Roblox APIs. " +
                "Never put API keys or secrets into generated Roblox code."
            },

            {
              role: "user",
              content:
                "Target platform: " + engine + "\n\n" +
                "User request:\n" + prompt
            }
          ],

          temperature: 0.2,

          max_tokens: 8192
        })
      });

      const text = await response.text();

      let data;

      try {
        data = JSON.parse(text);
      } catch (error) {
        output.innerText =
          "Groq returned an unexpected response.\n\n" +
          "HTTP Status: " + response.status + "\n\n" +
          text;

        return;
      }

      if (!response.ok) {
        const errorMessage =
          data &&
          data.error &&
          data.error.message
            ? data.error.message
            : "Unknown Groq error.";

        output.innerText =
          "Groq API Error\n\n" +
          "HTTP Status: " + response.status + "\n\n" +
          errorMessage;

        console.error("Groq error:", data);

        return;
      }

      if (
        data.choices &&
        data.choices.length > 0 &&
        data.choices[0].message
      ) {
        output.innerText =
          data.choices[0].message.content || "No code was returned.";

      } else {
        output.innerText =
          "Groq responded, but no generated code was found.\n\n" +
          JSON.stringify(data, null, 2);
      }

    } catch (error) {
      console.error("Request failed:", error);

      output.innerText =
        "Could not connect to Groq.\n\n" +
        "Error:\n" +
        error.message +
        "\n\n" +
        "Open your browser's Developer Console (F12) for more details.";
    }

    finally {
      button.disabled = false;
      button.innerText = "Generate Code";
    }
  }


  async function copyCode() {
    const code = document.getElementById("outputCode").innerText;

    if (!code) {
      return;
    }

    try {
      await navigator.clipboard.writeText(code);

      alert("Code copied to clipboard!");

    } catch (error) {
      alert(
        "Copy failed. Please select the generated code and copy it manually."
      );
    }
  }
</script>
