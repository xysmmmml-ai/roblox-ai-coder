<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox AI Script Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #fcf9f5;
      background-image: radial-gradient(#e2d5c3 0.75px, transparent 0.75px);
      background-size: 16px 16px;
    }
    .serif-title {
      font-family: 'Playfair Display', serif;
    }
  </style>
</head>
<body class="text-stone-700 min-h-screen p-6">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <header class="border-b border-rose-200/60 pb-5 text-center md:text-left">
      <h1 class="serif-title text-4xl font-semibold text-rose-900/80 tracking-wide">
        Roblox AI Script Generator
      </h1>
      <p class="text-stone-500 text-sm mt-1 italic">Craft elegant, clean Luau scripts for your Roblox Studio creations.</p>
    </header>

    <div class="bg-white/70 backdrop-blur-md border border-rose-100 rounded-2xl p-6 shadow-sm space-y-5">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 mb-2">Groq API Key</label>
        <input id="apiKey" type="password" placeholder="Paste your gsk_... key here" class="w-full bg-stone-50/80 border border-rose-200/80 rounded-xl p-3 text-stone-800 placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-rose-300 text-sm transition-all">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
        <div class="md:col-span-2">
          <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 mb-2">What script do you want to build?</label>
          <textarea id="prompt" class="w-full h-36 bg-stone-50/80 border border-rose-200/80 rounded-xl p-3 text-stone-800 placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-rose-300 text-sm transition-all" placeholder="e.g. Create a leaderstats script that saves player coins to DataStore when they leave..."></textarea>
        </div>

        <div class="flex flex-col justify-between">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-stone-500 mb-2">Target Platform</label>
            <select id="engine" class="w-full bg-stone-50/80 border border-rose-200/80 rounded-xl p-3 text-stone-800 focus:outline-none focus:ring-2 focus:ring-rose-300 text-sm mb-4">
              <option value="Roblox Studio">Roblox (Luau)</option>
              <option value="Unity C#">Unity (C#)</option>
              <option value="Godot GDScript">Godot (GDScript)</option>
            </select>
          </div>

          <button id="generateBtn" onclick="generateCode()" class="w-full bg-rose-400 hover:bg-rose-500 text-white font-medium py-3 rounded-xl shadow-sm transition-all text-sm active:scale-[0.99]">
            Generate Code
          </button>
        </div>
      </div>
    </div>

    <div id="outputContainer" class="hidden space-y-2">
      <div class="flex justify-between items-center px-1">
        <label class="text-xs font-semibold uppercase tracking-wider text-stone-500">Generated Code</label>
        <button onclick="copyCode()" class="text-xs bg-stone-200/80 hover:bg-stone-300/80 text-stone-700 px-3 py-1.5 rounded-lg transition-all font-medium">Copy Code</button>
      </div>
      <pre id="outputCode" class="bg-stone-900 border border-stone-800 rounded-2xl p-5 text-xs font-mono text-emerald-300 overflow-x-auto whitespace-pre-wrap shadow-inner"></pre>
    </div>

  </div>

  <script>
    async function getAvailableModel(apiKey) {
      try {
        const res = await fetch('https://api.groq.com/openai/v1/models', {
          headers: { 'Authorization': `Bearer ${apiKey}` }
        });
        const data = await res.json();
        if (data.data && data.data.length > 0) {
          // Find active model or fallback to dynamic select
          const preferredModels = ['llama-3.3-70b-versatile', 'llama-3.1-8b-instant', 'llama3-8b-8192', 'mixtral-8x7b-32768'];
          for (const model of preferredModels) {
            if (data.data.some(m => m.id === model)) return model;
          }
          return data.data[0].id;
        }
      } catch (e) {
        console.warn('Could not fetch dynamic models, using fallback.');
      }
      return 'llama-3.3-70b-versatile';
    }

    async function generateCode() {
      const apiKey = document.getElementById('apiKey').value;
      const prompt = document.getElementById('prompt').value;
      const engine = document.getElementById('engine').value;
      const btn = document.getElementById('generateBtn');
      const container = document.getElementById('outputContainer');
      const output = document.getElementById('outputCode');

      if (!apiKey) return alert('Please enter your Groq API key.');
      if (!prompt) return alert('Please enter a description for the script.');

      btn.innerText = 'Generating Script...';
      btn.disabled = true;
      container.classList.remove('hidden');
      output.innerText = 'Connecting to AI...';

      try {
        const activeModel = await getAvailableModel(apiKey);

        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: activeModel,
            messages: [
              { role: 'system', content: `You are an expert ${engine} developer. Write clean, production-ready code. For Roblox, specify script locations (ServerScriptService, StarterPlayerScripts, etc).` },
              { role: 'user', content: prompt }
            ],
            temperature: 0.2
          })
        });

        const data = await res.json();
        if (data.choices && data.choices[0]) {
          output.innerText = data.choices[0].message.content;
        } else {
          output.innerText = 'Error: ' + JSON.stringify(data);
        }
      } catch (err) {
        output.innerText = 'Failed to generate code. Check your API key and connection.';
      } finally {
        btn.innerText = 'Generate Code';
        btn.disabled = false;
      }
    }

    function copyCode() {
      const code = document.getElementById('outputCode').innerText;
      navigator.clipboard.writeText(code);
      alert('Code copied to clipboard!');
    }
  </script>
</body>
</html>
